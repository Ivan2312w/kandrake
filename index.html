<head>

    <style>
        /* --- ESTILO PREMIUM (Mesmas cores da sua marca) --- */
        :root {
            --primary: #d4a373;
            --bg: #fdfcf8;
            --surface: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --whatsapp: #25D366; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            background: linear-gradient(180deg, #faedcd 0%, #fdfcf8 40%); /* Degradê suave no topo */
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .container {
            width: 100%;
            max-width: 480px; /* Largura ideal para celular */
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- PERFIL --- */
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            box-shadow: 0 5px 15px rgba(212, 163, 115, 0.4);
            margin-bottom: 15px;
            background-color: #eee;
        }

        .username-row {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
        }

        .username {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        .verified { color: var(--primary); }

        .bio {
            text-align: center;
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 30px;
            line-height: 1.5;
            max-width: 90%;
        }

        /* --- LISTA DE BOTÕES (LINKS) --- */
        .link-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px; /* Espaço entre os botões */
        }

        .btn-link {
            background-color: var(--surface);
            color: var(--text-main);
            text-decoration: none;
            padding: 18px 20px;
            border-radius: 50px; /* Bordas bem redondas estilo Linktree */
            display: flex;
            align-items: center;
            justify-content: space-between; /* Espalha o texto e o ícone */
            border: 1px solid #eee;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            font-weight: 600;
            font-size: 15px;
        }

        /* Efeito ao passar o mouse */
        .btn-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            border-color: var(--primary);
        }

        /* Destaque especial para o botão do WhatsApp */
        .btn-whatsapp {
            border: 2px solid var(--whatsapp);
            background-color: #f0fdf4; /* Fundo levemente verde */
        }

        .btn-icon {
            font-size: 20px;
            width: 30px;
            display: flex;
            justify-content: center;
        }

        /* Ícone de seta no final do botão */
        .arrow-right {
            color: #ccc;
            font-size: 18px;
        }

        /* --- RODAPÉ --- */
        .social-icons {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }
        .social-link {
            font-size: 24px;
            color: var(--primary);
            text-decoration: none;
            opacity: 0.8;
            transition: 0.2s;
        }
        .social-link:hover { opacity: 1; transform: scale(1.1); }
        
        .footer-text {
            margin-top: 25px;
            font-size: 12px;
            color: #bbb;
        }

    </style>
</head>
