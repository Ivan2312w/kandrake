<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces Oficiales - Tu Mejor Versión</title>
    <style>
        /* --- CONFIGURAÇÕES PREMIUM --- */
        :root {
            --primary: #d4a373;
            --primary-dark: #b07d62;
            --bg: #fdfcf8;
            --surface: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --accent: #e63946; 
            --green: #25D366; /* Verde Oficial do WhatsApp */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #faedcd 0%, #fdfcf8 30%);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- PERFIL --- */
        .profile-wrapper {
            text-align: center;
            margin-bottom: 35px;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--surface);
            box-shadow: 0 8px 20px rgba(212, 163, 115, 0.3);
            margin-bottom: 10px;
            background-color: #eee;
        }

        .username-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .username {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .verified-badge {
            color: var(--primary);
            font-size: 18px;
        }

        .rating {
            color: #FFD700;
            font-size: 14px;
            margin-top: 4px;
            font-weight: 600;
        }
        .rating span { color: var(--text-sub); font-size: 12px; font-weight: 400; }

        .bio {
            font-size: 15px;
            color: var(--text-sub);
            margin-top: 8px;
            line-height: 1.4;
            max-width: 90%;
            margin-left: auto;
            margin-right: auto;
        }

        /* --- LINKS --- */
        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            background: var(--surface);
            padding: 16px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid #eee;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            position: relative;
        }

        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border-color: var(--primary);
        }

        /* BOTÃO HERO */
        .link-hero {
            background: #fff;
            border: 2px solid var(--primary);
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: subtle-pulse 3s infinite;
        }

        .hero-thumb {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background-color: #ddd;
        }

        .hero-content { text-align: left; flex: 1; }
        .hero-title { font-weight: 800; font-size: 16px; color: var(--primary-dark); display: block; margin-bottom: 4px; }
        .hero-subtitle { font-size: 13px; color: var(--text-sub); display: block; line-height: 1.3; }
        .hero-price { color: var(--green); font-weight: 700; font-size: 14px; margin-top: 4px; display: block; }

        .tag-promo {
            position: absolute;
            top: -10px;
            right: 15px;
            background: var(--accent);
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(230, 57, 70, 0.4);
            animation: float 3s ease-in-out infinite;
        }

        .link-secondary { justify-content: space-between; padding: 20px; }
        .link-title { font-weight: 600; font-size: 15px; }
        .icon-right { color: #ccc; }

        .social-wrapper { margin-top: 40px; display: flex; gap: 25px; }
        .social-icon { font-size: 26px; color: var(--primary); transition: transform 0.2s; text-decoration: none; }
        .social-icon:hover { transform: scale(1.2); }
        .copyright { margin-top: 30px; font-size: 12px; color: #aaa; }

        @keyframes subtle-pulse {
            0% { box-shadow: 0 0 0 0 rgba(212, 163, 115, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(212, 163, 115, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 163, 115, 0); }
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
            100% { transform: translateY(0px); }
        }

    </style>
</head>
