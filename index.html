<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces - Tu Mejor Versión</title>
    <style>
        /* --- ESTILO LIMPO E PREMIUM --- */
        :root {
            --bg: #fdfcf8;
            --surface: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --primary: #d4a373; /* Cor Dourada/Bege */
            --green: #25D366;   /* WhatsApp */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            /* Fundo clean com leve degradê no topo */
            background: linear-gradient(180deg, #faedcd 0%, #fdfcf8 35%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- PERFIL --- */
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--surface);
            box-shadow: 0 5px 15px rgba(212, 163, 115, 0.3);
            margin-bottom: 15px;
            background-color: #eee;
        }

        .username {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .verified { color: var(--primary); }

        .bio {
            text-align: center;
            font-size: 15px;
            color: var(--text-sub);
            margin-bottom: 35px;
            line-height: 1.4;
        }

        /* --- LISTA DE LINKS --- */
        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Estilo Geral dos Botões */
        .link-card {
            background: var(--surface);
            text-decoration: none;
            color: var(--text-main);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid #eee;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border-color: var(--primary);
        }

        /* Imagem Pequena dentro do botão (Thumbnail) */
        .btn-thumb {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            background-color: #f0f0f0;
        }

        /* Texto do botão */
        .btn-content { flex: 1; display: flex; flex-direction: column; gap: 3px; }
        .btn-title { font-weight: 700; font-size: 15px; }
        .btn-subtitle { font-size: 13px; color: var(--text-sub); }

        /* Ícone de Seta */
        .icon-arrow { color: #ccc; font-size: 20px; }

        /* Estilo Específico para WhatsApp (Borda Verde) */
        .whatsapp-style {
            border: 2px solid #e0f2e9;
        }
        .whatsapp-style:hover {
            border-color: var(--green);
        }

        /* Rodapé Simples */
        .footer {
            margin-top: 50px;
            font-size: 12px;
            color: #ccc;
        }

    </style>
</head>
